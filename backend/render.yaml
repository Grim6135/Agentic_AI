services:
  - type: web
    name: trippy-backend
    runtime: python
    region: oregon
    # Applying this blueprint creates billed resources.
    plan: standard
    disk:
      name: trippy-data
      mountPath: /var/lib/trippy
      sizeGB: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.host
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_DIR
        value: /var/lib/trippy
      - key: GROQ_API_KEY
        sync: false
      - key: ADK_SERVICE_TOKEN
        generateValue: true
